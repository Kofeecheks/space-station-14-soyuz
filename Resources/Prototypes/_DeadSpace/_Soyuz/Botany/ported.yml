- type: entity
  parent: [FoodProduceBase, ItemHeftyBase]
  id: FoodGranatapfel
  components:
    - type: FlavorProfile
      flavors:
        - granatapfel
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 9
          canReact: false
          reagents:
            - ReagentId: Sulfur
              Quantity: 3
            - ReagentId: Ethanol
              Quantity: 3
            - ReagentId: Hydrogen
              Quantity: 3
    - type: Sprite
      sprite: _DeadSpace/_Soyuz/Objects/Specific/Hydroponics/granatapfel.rsi
    - type: Produce
      seedId: granatapfel
    - type: Extractable
      grindableSolutionName: food
      juiceSolution:
        reagents:
          - ReagentId: WeldingFuel
            Quantity: 10
    - type: Damageable
      damageContainer: Biological
    - type: DamageOnHighSpeedImpact
      minimumSpeed: 0.1
      damage:
        types:
          Blunt: 1
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 1
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                path: /Audio/Effects/pop.ogg
            - !type:TriggerBehavior
              keyOut: granatapfel-trigger
            - !type:DoActsBehavior
              acts: ["Destruction"]
    - type: ChemicalAmmo
      solution: food
    - type: ProjectileGrenade
      fillPrototype: GranatapfelSeeds
      capacity: 10
      triggerKey: granatapfel-trigger
    - type: ContainerContainer
      containers:
        cluster-payload: !type:Container
    - type: Tag
      tags:
        - Fruit
    - type: FoodSequenceElement
      entries:
        Burger: Granatapfel
        Taco: Granatapfel


