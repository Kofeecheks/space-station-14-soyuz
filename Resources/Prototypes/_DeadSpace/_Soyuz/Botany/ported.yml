  desc: reagent-desc-juice-pomegranate
  physicalDesc: reagent-physical-desc-crisp
  flavor: fruity
  color: "#a8151a"
  recognizable: true

- type: reagent
  id: NevcottaPowder
  name: reagent-name-nevcottapowder
  group: Toxins
  desc: reagent-desc-nevcottapowder
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#faf9f6"
  metabolisms:
    Poison:
      metabolismRate: 0.05
      effects:
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: NevcottaPowder
          min: 10
        probability: 0.15
      - !type:HealthChange
        damage:
          types:
            Poison: 2
            Asphyxiation: 0.25
      - !type:ModifyParalysis
        probability: 0.05
        time: 2

- type: reagent
  id: Negacordrazine
  name: reagent-name-negacordrazine
  group: Medicine
  desc: reagent-desc-negacordrazine
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#d34b26"
  metabolisms:
    Medicine:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        conditions:
        - !type:TotalDamageCondition
          min: 30
        damage:
          types:
            Asphyxiation: -1
            Bloodloss: -1
            Blunt: -0.4
            Slash: -0.4
            Piercing: -0.4
            Heat: -0.4
            Shock: -0.4
            Cold: -0.4
            Caustic: -0.4
            Poison: -1
            Radiation: -1

- type: constructionGraph
